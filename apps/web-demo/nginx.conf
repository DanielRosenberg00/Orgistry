# Static serving for the built web demo (Sprint 23, ORG-PR-001).
#
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged
# (non-root; listens on 8080). Scope: serve the Vite production build with an
# SPA history fallback. TLS termination and the full security-header policy
# for the web origin belong to the fronting reverse proxy in a real
# deployment — the API sets its own headers for API responses only
# (docs/deployment-artifacts.md, "Security-header boundary").

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening that is safe regardless of the fronting proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Vite emits content-hashed filenames under /assets — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA history fallback: client-side routes resolve to index.html, which
    # must always be revalidated so deploys take effect immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
