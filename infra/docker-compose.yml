# Local development infrastructure for Orgistry.
#
# Services:
#   postgres  - durable local store              (host port 5432)
#   redis     - auth + external-API rate limiting + readiness probe (host port 6379)
#   mailpit   - local invitation email delivery; SMTP 1025, web UI http://localhost:8025
#
# No worker/queue runtime, object storage, or production deployment concerns
# are defined here — those are intentionally out of scope (see
# docs/known-limitations.md). Credentials below are local-only development
# defaults and are NOT secrets.
#
# Image references are pinned to exact patch tags PLUS manifest-list digests
# (Sprint 21 tags, Sprint 23 digests — ORG-PR-042), so local/CI infrastructure
# is reproducible and immune to tag re-pushes. Dependabot proposes bumps;
# update procedure: docs/validation.md ("Image pinning policy").
name: orgistry

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgistry}
      POSTGRES_DB: ${POSTGRES_DB:-orgistry}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the `orgistry_test` database on first volume init.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orgistry}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
