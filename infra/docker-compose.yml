# Local development infrastructure for Orgistry.
#
# Services:
#   postgres  - durable local store              (host port 5432)
#   redis     - auth + external-API rate limiting + readiness probe (host port 6379)
#   mailpit   - local invitation email delivery; SMTP 1025, web UI http://localhost:8025
#
# No worker/queue runtime, object storage, or production deployment concerns
# are defined here — those are intentionally out of scope (see
# docs/known-limitations.md). Credentials below are local-only development
# defaults and are NOT secrets.
#
# Image tags are pinned to exact patch versions (Sprint 21, ORG-PR-042) so
# local/CI infrastructure is reproducible; Dependabot proposes tag bumps.
# Digest pinning is deferred to the production artifact track — see
# docs/production-readiness/findings-register.md (ORG-PR-042).
name: orgistry

services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgistry}
      POSTGRES_DB: ${POSTGRES_DB:-orgistry}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the `orgistry_test` database on first volume init.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orgistry}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
