name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (Sprint 21, ORG-PR-019): both jobs only read the repository.
# The default GITHUB_TOKEN write scopes are never needed here.
permissions:
  contents: read

# A superseded run on the same ref is cancelled instead of finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three jobs that mirror the local validation matrix (see docs/validation.md):
#   validate    -> the offline gate, equivalent to `pnpm validate`
#   integration -> the live-service gate, equivalent to `pnpm validate:integration`,
#                  plus the logical backup/restore drill (`pnpm drill:restore`)
#   artifacts   -> the deployable-artifact gate, equivalent to `pnpm artifact:smoke`,
#                  plus the restore drill against the packaged artifact
#
# The PITR drill is deliberately NOT here — see
# .github/workflows/data-durability.yml.
#
# Action pinning policy (ORG-PR-019): every `uses:` is a full commit SHA with
# the upstream version in a trailing comment. Dependabot proposes pin bumps;
# see docs/validation.md for the review procedure.
jobs:
  # ---- Offline gate: no databases, no network services ----
  validate:
    name: Validate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Web demo tests
        run: pnpm test:web

      - name: Web demo build
        run: pnpm build:web

      - name: Schema drift check
        run: pnpm db:check

      - name: Whitespace check
        run: pnpm check:whitespace

  # ---- Live-service gate: PostgreSQL + Redis (Mailpit is not exercised here) ----
  integration:
    name: Integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest

    # Service images are pinned tag+digest (ORG-PR-042). Dependabot does NOT
    # cover workflow `services:` images — bump these manually alongside
    # infra/docker-compose.yml (procedure: docs/validation.md).
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: orgistry
          POSTGRES_PASSWORD: orgistry
          POSTGRES_DB: orgistry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgistry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Mailpit is intentionally omitted — no integration test exercises LIVE
    # SMTP delivery. The account mailer (invitations + email verification) is
    # covered by unit tests against an in-process fake SMTP server (incl. the
    # TLS+AUTH production driver); integration suites inject the in-memory
    # mailer. Live Mailpit delivery is verified manually. See
    # docs/known-limitations.md.
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://orgistry:orgistry@localhost:5432/orgistry
      TEST_DATABASE_URL: postgres://orgistry:orgistry@localhost:5432/orgistry_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-value-1234

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE orgistry_test;'

      - name: Apply migration baseline (dev database)
        run: pnpm db:migrate

      # Resets the test database to the migration baseline, then runs the DB
      # migration-from-scratch test plus the live API readiness + route
      # integration tests against PostgreSQL + Redis. Equivalent to
      # `pnpm validate:integration`.
      - name: Integration tests
        run: pnpm validate:integration

      # Sprint 25 (ORG-PR-005): the backup/restore drill. Self-contained —
      # it creates its OWN throwaway PostgreSQL containers via Docker (the
      # service containers above are untouched), takes a real backup with
      # tooling/db-backup.sh, restores into a fresh database, and asserts the
      # schema, migration metadata, and seeded Orgistry data survived. The
      # packaged-artifact half of the drill runs in the `artifacts` job below,
      # where the image already exists. PITR is NOT run here — it needs two
      # servers, WAL archiving, and a recovery wait; it lives in
      # .github/workflows/data-durability.yml (docs/pitr.md explains the
      # tradeoff).
      - name: Backup + restore drill (data layer)
        run: ./tooling/db-restore-drill.sh

  # ---- Deployable-artifact gate: production images build + smoke-test ----
  #
  # Sprint 23 (ORG-PR-001): builds the production-shaped API and web images
  # from their Dockerfiles and validates them against the production-like
  # compose reference — NODE_ENV=production boot with fake guard-passing
  # config, explicit one-shot migrations, /health + /ready (incl. fail-closed
  # readiness on a Redis outage), non-root runtimes, artifact hygiene, secret
  # absence from logs and web assets, config-guard rejection of unsafe values,
  # and clean SIGTERM shutdown. Needs no production secrets; publishes and
  # pushes nothing — images exist only inside the runner.
  artifacts:
    name: Artifacts (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build artifacts and run smoke tests
        run: ./tooling/artifact-smoke.sh

      # Sprint 25 (ORG-PR-005/ORG-PR-015): the recovery contract that involves
      # the artifact — restored PostgreSQL -> the artifact's migration
      # entrypoint -> the packaged API -> /health, /ready -> an API-key
      # authenticated read of restored data -> the packaged retention command.
      # Reuses the image the smoke step just built, so this needs no workspace
      # install: with --with-artifact the drill migrates through
      # `dist/migrate.mjs` instead of `pnpm db:migrate`.
      - name: Restore drill against the deployable artifact
        run: ./tooling/db-restore-drill.sh --with-artifact
