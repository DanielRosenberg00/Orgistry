# Dependency update automation (Sprint 21, ORG-PR-019/020/042).
#
# Policy: weekly routine update PRs, security advisories surface as promptly
# as the platform allows, every PR requires human review, and nothing is
# auto-merged (no auto-merge configuration exists in this repository).
# Review procedure — including how to verify a pinned-Action SHA bump against
# the upstream release — is documented in docs/validation.md.
version: 2
updates:
  # npm/pnpm workspace (root pnpm-lock.yaml covers every workspace package).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Group routine minor+patch noise; majors stay individual PRs so breaking
    # upgrades are reviewed on their own.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — proposes updates to the full-SHA pins in
  # .github/workflows/*, keeping the version comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Infrastructure images referenced from compose files: the local dev stack
  # (docker-compose.yml) and the production-like artifact reference
  # (compose.production-like.yml). All references are pinned tag+digest
  # (ORG-PR-042); Dependabot proposes coordinated tag+digest bumps.
  # NOT covered by Dependabot (bump manually, same digests — see
  # docs/validation.md): the `services:` images in .github/workflows/ci.yml.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday

  # Production Dockerfile base images (Sprint 23): node bookworm-slim for the
  # API build/runtime and web build; nginx-unprivileged for the web runtime.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web-demo
    schedule:
      interval: weekly
      day: monday
